deudas:{q:'Las deudas y la falta de dinero son una de las causas más comunes de ansiedad e insomnio en Colombia. El estrés no paga las cuentas, pero sí nubla la mente para resolverlas.',s:['Pensar en plata todo el día','Evitar abrir mensajes del banco o llamadas de cobro','Discusiones en casa por dinero','Vergüenza o culpa'],h:['Escribir todas las deudas en un solo lugar: verlas reduce la angustia','Separar lo urgente (comida, arriendo, servicios) de lo demás','Llamar al banco o acreedor para pedir un acuerdo de pago','Hablarlo con alguien de confianza: el silencio aumenta la carga','Recordar: tu valor no depende de tu saldo'],tools:['preocupa','pensamiento','respira'],p:['El estrés por dinero te impide dormir o trabajar','Piensas que la única salida es hacerte daño: llama a la Línea 106']},

const OPTS=['Nunca','Varios días','Más de la mitad de los días','Casi todos los días'];
const TESTS={gad7:{n:'Chequeo de ansiedad (GAD-7)',q:['Te has sentido nervioso/a, ansioso/a o con los nervios de punta','No has podido dejar de preocuparte o controlar la preocupación','Te has preocupado demasiado por diferentes cosas','Has tenido dificultad para relajarte','Te has sentido tan inquieto/a que no podías quedarte quieto/a','Te has molestado o irritado con facilidad','Has sentido miedo, como si algo terrible fuera a pasar'],b:[[4,'Mínima'],[9,'Leve'],[14,'Moderada'],[21,'Severa']]},
phq9:{n:'Chequeo de ánimo (PHQ-9)',q:['Poco interés o placer en hacer cosas','Te has sentido decaído/a, deprimido/a o sin esperanza','Dificultad para dormir o mantenerte dormido/a, o has dormido demasiado','Te has sentido cansado/a o con poca energía','Poco apetito o has comido en exceso','Te has sentido mal contigo mismo/a, o que eres un fracaso o que has defraudado a tu familia o a ti','Dificultad para concentrarte, por ejemplo al leer o ver televisión','Te has movido o hablado tan lento que otros lo notaron, o al contrario, muy inquieto/a','Pensamientos de que estarías mejor muerto/a o de hacerte daño de alguna forma'],b:[[4,'Mínima'],[9,'Leve'],[14,'Moderada'],[19,'Moderadamente severa'],[27,'Severa']]}};
function openTest(id){const T=TESTS[id];screen(`${back()}<h1>${T.n}</h1><p class="sm mut" style="line-height:1.5">En las últimas 2 semanas, ¿con qué frecuencia te ha pasado lo siguiente? Es una herramienta de orientación, no un diagnóstico.</p>
${T.q.map((q,i)=>`<div class="card"><b class="sm">${i+1}. ${q}</b><div class="chips" style="margin-top:10px" id="q${i}">${OPTS.map((o,v)=>`<button class="chip" data-v="${v}" onclick="document.querySelectorAll('#q${i} .chip').forEach(b=>b.classList.remove('on'));this.classList.add('on')">${o}</button>`).join('')}</div></div>`).join('')}
<button class="btn pri full" onclick="testDone('${id}')">Ver resultado</button>`)}
function testDone(id){const T=TESTS[id],a=T.q.map((_,i)=>document.querySelector(`#q${i} .on`));if(a.some(x=>!x)){toast('Responde todas las preguntas');return}
const v=a.map(x=>+x.dataset.v),sc=v.reduce((s,x)=>s+x,0),band=T.b.find(b=>sc<=b[0])[1],risk=id==='phq9'&&v[8]>0;tests.push({date:iso(today()),id,sc,band});save();
screen(`${back()}<h1>Tu resultado</h1>${risk?`<div class="card crisis"><b>Marcaste pensamientos de muerte o de hacerte daño.</b><p class="sm" style="margin:6px 0 12px">Eso es importante y mereces apoyo hoy. Habla con alguien: la Línea 106 es gratuita, confidencial y atiende 24 horas.</p><div class="row"><a class="btn sos full" style="text-align:center;text-decoration:none" href="tel:106">📞 Línea 106</a><a class="btn sos full" style="text-align:center;text-decoration:none" href="tel:123">🚨 123</a></div></div>`:''}
<div class="card" style="text-align:center"><div class="xs mut">${T.n}</div><div class="big" style="color:var(--ac)">${sc}</div><h2>${band}</h2></div>
<div class="card sm" style="line-height:1.5">${sc>=10?'Tu puntaje sugiere que te vendría bien hablar con un profesional de psicología. Puedes pedir cita en tu EPS o llamar gratis a la Línea 106 para orientación.':sc>=5?'Hay algunos síntomas. Las herramientas de Refugio pueden ayudarte; si en 2 semanas no mejora, busca a un profesional.':'Tu puntaje es bajo. Sigue cuidándote.'}<p class="xs mut" style="margin:10px 0 0">Repite el chequeo cada 2 semanas para ver cómo cambias. Este resultado no es un diagnóstico.</p></div>
<button class="btn ghost full" onclick="closeS()">Listo</button>`)}

/* ===== Misiones del día ===== */
function missions(){const t=iso(today());return [['Registrar cómo me siento',moods.some(m=>m.date===t)],['Practicar una técnica',uses.some(u=>u.date===t)],['Escribir algo para mí',[...thoughts,...grat,...notes].some(x=>x.date===t)]]}

/* ===== Progreso ===== */
function streak(){let n=0;const s=new Set(moods.map(m=>m.date));for(let d=today();;d.setDate(d.getDate()-1)){if(s.has(iso(d)))n++;else if(iso(d)!==iso(today()))break;if(n>400)break}return n}
function vProg(){const days=new Set([...moods.map(m=>m.date),...uses.map(u=>u.date)]).size;
let h=hdr('Tu progreso',`Desde ${new Date(P.start+'T00:00:00').toLocaleDateString('es-CO',{day:'numeric',month:'long'})}`);
h+=`<div class="card" style="text-align:center">${plant(points(),150)}<h2>${stageName()}</h2><p class="sm mut" style="margin:4px 0 0">${points()} cuidados en total</p></div>`;
h+=`<div class="kpis"><div class="kpi"><div class="n">${streak()}</div><div class="xs mut">Días seguidos registrando</div></div><div class="kpi"><div class="n">${days}</div><div class="xs mut">Días cuidándote</div></div><div class="kpi"><div class="n">${uses.length}</div><div class="xs mut">Técnicas practicadas</div></div><div class="kpi"><div class="n">${thoughts.length+grat.length+notes.length}</div><div class="xs mut">Escritos guardados</div></div></div>`;
const D=[];for(let i=29;i>=0;i--){const d=today();d.setDate(d.getDate()-i);const m=moods.filter(x=>x.date===iso(d));D.push(m.length?m[m.length-1].v:null)}
const pts=D.map((v,i)=>v?[12+i*(296/29),110-(v-1)*22]:null);let path='';pts.forEach((p,i)=>{if(p)path+=(path&&pts[i-1]?'L':'M')+p[0]+' '+p[1]});
h+=`<div class="card"><h3>Tu ánimo · últimos 30 días</h3>${moods.length?`<svg viewBox="0 0 320 130" style="width:100%;margin-top:10px">${[1,2,3,4,5].map(v=>`<line x1="12" x2="308" y1="${110-(v-1)*22}" y2="${110-(v-1)*22}" style="stroke:var(--line)"/><text x="0" y="${114-(v-1)*22}" font-size="10">${MOODS[v-1][0]}</text>`).join('')}<path d="${path}" fill="none" stroke="url(#gr)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><defs><linearGradient id="gr"><stop offset="0" stop-color="#a78bfa"/><stop offset="1" stop-color="#5eead4"/></linearGradient></defs>${pts.map(p=>p?`<circle cx="${p[0]}" cy="${p[1]}" r="3.5" fill="#5eead4"/>`:'').join('')}</svg>`:'<p class="sm mut">Registra cómo te sientes en Inicio y aquí verás tu evolución.</p>'}</div>`;
const pd=new Set(uses.map(u=>u.date)),a=moods.filter(m=>pd.has(m.date)),b=moods.filter(m=>!pd.has(m.date)),av=x=>x.reduce((s,m)=>s+m.v,0)/x.length;
if(a.length>=3&&b.length>=3&&av(a)>av(b))h+=`<div class="card" style="border-left:3px solid var(--ac)"><b>💡 Descubrimiento</b><p class="sm" style="margin:6px 0 0">Los días que practicas una técnica, tu ánimo es en promedio <b>${(av(a)-av(b)).toFixed(1)} puntos mejor</b>. ¡Sigue así!</p></div>`;
const af=uses.filter(u=>u.after);if(af.length)h+=`<div class="card"><h3>Técnicas que más te sirven</h3>${Object.entries(af.reduce((o,u)=>{(o[u.tool]=o[u.tool]||[]).push(u.after);return o},{})).map(([k,v])=>[k,v.reduce((s,x)=>s+x,0)/v.length]).sort((x,y)=>y[1]-x[1]).slice(0,4).map(([k,v])=>`<div class="row between" style="padding:6px 0;cursor:pointer" onclick="openTool('${k}')"><span>${TOOLS[k].ic} ${TOOLS[k].n}</span><span>${MOODS[Math.round(v)-1][0]}</span></div>`).join('')}</div>`;
const tc={};moods.slice(-30).forEach(m=>m.tags.forEach(t=>tc[t]=(tc[t]||0)+1));const te=Object.entries(tc).sort((x,y)=>y[1]-x[1]).slice(0,5);
if(te.length)h+=`<div class="card"><h3>Emociones más frecuentes</h3>${te.map(([t,n])=>`<div style="margin-top:8px"><div class="row between sm"><span>${t}</span><span class="mut">${n}</span></div><div class="prog"><i style="width:${n/te[0][1]*100}%"></i></div></div>`).join('')}</div>`;
const t0=today(),first=new Date(t0.getFullYear(),t0.getMonth(),1),off=(first.getDay()+6)%7,dim=new Date(t0.getFullYear(),t0.getMonth()+1,0).getDate(),MC=['#ff6b81','#f59e8b','#9aa1c7','#7dd3c0','#5eead4'];
h+=`<div class="card"><h3>${t0.toLocaleDateString('es-CO',{month:'long',year:'numeric'})}</h3><div style="display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:10px;text-align:center">${['L','M','M','J','V','S','D'].map(d=>`<div class="xs mut">${d}</div>`).join('')}${'<div></div>'.repeat(off)}${Array.from({length:dim},(_,i)=>{const ds=iso(new Date(t0.getFullYear(),t0.getMonth(),i+1)),m=moods.filter(x=>x.date===ds).pop();return `<div style="aspect-ratio:1;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:12px;background:${m?MC[m.v-1]+'55':'var(--card2)'};border:${ds===iso(t0)?'2px solid var(--ac)':'0'}">${m?MOODS[m.v-1][0]:i+1}</div>`}).join('')}</div></div>`;
const ai=ACTV.map(a=>{const w=moods.filter(m=>(m.acts||[]).includes(a)),wo=moods.filter(m=>m.acts&&!m.acts.includes(a));return w.length>=3&&wo.length>=3?[a,av(w)-av(wo)]:null}).filter(Boolean).sort((x,y)=>Math.abs(y[1])-Math.abs(x[1])).slice(0,4);
if(ai.length)h+=`<div class="card"><h3>Qué influye en tu ánimo</h3>${ai.map(([a,d])=>`<div class="row between" style="padding:6px 0"><span>${a}</span><b style="color:${d>=0?'var(--ac)':'var(--sos)'}">${d>=0?'+':''}${d.toFixed(1)}</b></div>`).join('')}<p class="xs mut" style="margin:6px 0 0">Diferencia en tu ánimo los días que lo haces frente a los que no.</p></div>`;
if(tests.length)h+=`<div class="card"><h3>Mis chequeos</h3>${tests.slice(-6).reverse().map(t=>`<div class="row between" style="padding:6px 0"><span class="sm">${t.id==='gad7'?'Ansiedad':'Ánimo'} · ${new Date(t.date+'T00:00:00').toLocaleDateString('es-CO',{day:'numeric',month:'short'})}</span><span><b>${t.sc}</b> <span class="xs mut">${t.band}</span></span></div>`).join('')}</div>`;
h+=`<button class="btn ghost full" onclick="openJournal()">📓 Ver mis escritos</button><button class="btn ghost full" style="margin-top:8px" onclick="openReport()">🩺 Resumen para mi psicólogo</button>`;return h}
function openReport(){const L=moods.filter(m=>(today()-new Date(m.date+'T00:00:00'))/864e5<=30),tc={};L.forEach(m=>m.tags.forEach(t=>tc[t]=(tc[t]||0)+1));const uc={};uses.filter(u=>(today()-new Date(u.date+'T00:00:00'))/864e5<=30).forEach(u=>uc[u.tool]=(uc[u.tool]||0)+1);
const txt=`RESUMEN REFUGIO · últimos 30 días
Nombre: ${P.name}
Fecha: ${new Date().toLocaleDateString('es-CO')}

Días con registro de ánimo: ${L.length}
Ánimo promedio: ${L.length?(L.reduce((s,m)=>s+m.v,0)/L.length).toFixed(1):'—'} (1 = muy mal, 5 = muy bien)
Días con ánimo "muy mal": ${L.filter(m=>m.v===1).length}
Emociones más frecuentes: ${Object.entries(tc).sort((a,b)=>b[1]-a[1]).slice(0,5).map(([t,n])=>t+' ('+n+')').join(', ')||'—'}
Técnicas practicadas: ${Object.entries(uc).map(([k,n])=>TOOLS[k].n+' ('+n+')').join(', ')||'—'}
Chequeos: ${tests.slice(-4).map(t=>(t.id==='gad7'?'GAD-7':'PHQ-9')+' '+t.sc+' ('+t.band+', '+t.date+')').join('; ')||'—'}
Temas que trabajo: ${P.topics.map(k=>TOPICS[k]).join(', ')}`;
screen(`${back()}<h1>Resumen para mi psicólogo</h1><p class="sm mut">Compártelo en tu próxima cita. No incluye tus escritos privados.</p><textarea id="rep" style="min-height:300px;font-size:13px">${esc(txt)}</textarea><button class="btn pri full" style="margin-top:10px" onclick="(async()=>{try{await navigator.clipboard.writeText($('#rep').value);toast('Resumen copiado')}catch(e){$('#rep').select();toast('Selecciona y copia el texto')}})()">Copiar resumen</button>`)}
function openJournal(){const it=[...thoughts.map(t=>({d:t.date,h:`🧠 <b>${esc(t.th)}</b>${t.alt?`<div class="sm mut">→ ${esc(t.alt)}</div>`:''}<div class="xs mut">${t.a}% → ${t.b}%</div>`})),...grat.map(g=>({d:g.date,h:`✨ ${g.it.map(esc).join(' · ')}`})),...notes.map(n=>({d:n.date,h:n.type==='carta'?`✉️ <b>${esc(n.to||'Carta')}</b><div class="sm mut" style="white-space:pre-line">${esc(n.t)}</div>`:`📦 ${esc(n.w)}${n.step?`<div class="sm mut">Paso: ${esc(n.step)} · ${esc(n.when)}</div>`:''}`})),...moods.filter(m=>m.note).map(m=>({d:m.date,h:`${MOODS[m.v-1][0]} ${esc(m.note)}`}))].sort((a,b)=>a.d<b.d?1:-1);
screen(`${back()}<h1>Mis escritos</h1>${it.length?it.map(x=>`<div class="card"><div class="xs mut">${new Date(x.d+'T00:00:00').toLocaleDateString('es-CO',{day:'numeric',month:'short'})}</div><div style="margin-top:6px">${x.h}</div></div>`).join(''):'<p class="mut">Aún no tienes escritos.</p>'}`)}

/* ===== Ajustes ===== */
function openSettings(){modal(`<div class="row between"><h2>Ajustes</h2><button class="btn sm" onclick="closeM()">Cerrar</button></div>
<label class="f">Tu nombre</label><input id="sn" value="${esc(P.name)}"><label class="f">Temas que trabajas</label><div class="chips" id="stp">${Object.entries(TOPICS).map(([k,v])=>`<button class="chip ${P.topics.includes(k)?'on':''}" data-k="${k}" onclick="this.classList.toggle('on')">${v}</button>`).join('')}</div>
<button class="btn pri full" style="margin-top:12px" onclick="P.name=$('#sn').value.trim()||P.name;P.topics=[...document.querySelectorAll('#stp .on')].map(b=>b.dataset.k);if(!P.topics.length)P.topics=['ansiedad'];save();closeM();render()">Guardar</button>
<label class="f">Colores de la app</label><div class="chips">${[['auto','🌗 Automático'],['amanecer','🌅 Amanecer (claro)'],['noche','🌙 Noche (oscuro)']].map(([k,v])=>`<button class="chip ${(P.theme||'auto')===k?'on':''}" onclick="P.theme='${k}';save();applyTheme();openSettings()">${v}</button>`).join('')}</div><p class="xs mut" style="margin:6px 0 0">Automático: claro de 6 a. m. a 6 p. m. y oscuro en la noche.</p>
<button class="btn ghost full" style="margin-top:14px" onclick="setPin()">🔒 ${P.pin?'Cambiar o quitar PIN':'Proteger con PIN'}</button>
<label class="row" style="margin-top:14px;cursor:pointer"><input type="checkbox" style="width:22px;height:22px" ${P.voice!==false?'checked':''} onchange="P.voice=this.checked;save()"> <span>Voz guía en los ejercicios</span></label>
<p class="sm mut" style="margin-top:18px">Tus datos se guardan solo en este celular. Nadie más puede verlos.</p>
<button class="btn ghost full" onclick="copyBk()">Copiar respaldo</button><textarea id="bk" style="margin-top:8px;min-height:60px" placeholder="Pega aquí un respaldo para restaurarlo"></textarea><button class="btn ghost full" style="margin-top:8px" onclick="restoreBk()">Restaurar respaldo</button><div id="bkm" class="sm" style="color:var(--ac);margin-top:6px"></div>
<button class="btn ghost full" style="margin-top:14px;color:var(--sos)" onclick="if(this.dataset.c){localStorage.clear();location.reload()}else{this.dataset.c=1;this.textContent='Toca otra vez para borrar todo'}">Borrar todos mis datos</button>`)}
async function copyBk(){const t=btoa(unescape(encodeURIComponent(JSON.stringify({lic,P,moods,uses,thoughts,grat,plan,notes,tests,progs,contacts}))));try{await navigator.clipboard.writeText(t);$('#bkm').textContent='Respaldo copiado. Guárdalo en tus notas.'}catch(e){$('#bk').value=t;$('#bkm').textContent='Copia el texto del recuadro.'}}
function restoreBk(){try{const d=JSON.parse(decodeURIComponent(escape(atob($('#bk').value.trim()))));({P,moods,uses,thoughts,grat,plan,notes}=d);tests=d.tests||[];progs=d.progs||{};contacts=d.contacts||[];if(d.lic){lic=d.lic;store.set('lic',lic)}save();closeM();render()}catch(e){$('#bkm').textContent='El respaldo no es válido.'}}

window.addEventListener('hashchange',()=>{const t=location.hash.slice(1);if(NAV[t]&&t!==tab){tab=t;render()}});
if(!NAV[tab])tab='inicio';render();
if('serviceWorker' in navigator&&location.hostname.endsWith('github.io'))try{navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}
</script>
<script>(function(){const m=(location.hash||'').match(/activar=([^&]+)/);if(!m)return;verifyLic(decodeURIComponent(m[1])).then(n=>{try{history.replaceState(null,'',location.pathname)}catch(e){}if(n)licOK(n);else{const M='Ese enlace de activación no es válido. Escríbenos por WhatsApp al 320 290 3722.';showAct=true;render();const e=document.getElementById('aerr');if(e)e.textContent=M;else{const d=document.createElement('div');d.textContent=M;d.style.cssText='position:fixed;left:16px;right:16px;bottom:24px;z-index:9999;background:#c4473d;color:#fff;padding:14px;border-radius:12px;font:600 15px system-ui;text-align:center';document.body.appendChild(d);setTimeout(()=>d.remove(),8000)}}})})();</script>
